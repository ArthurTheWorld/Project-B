name: Projeto B CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  expectations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # As suites sao Python puro (stdlib) desde a reescrita: nao ha
      # dependencia de great-expectations, pyyaml nem pandas.
      - name: Sintaxe das suites e scripts
        run: python -m compileall -q project-b/expectations project-b/scripts

      - name: Validar expectations
        working-directory: project-b
        run: python scripts/run_expectations.py